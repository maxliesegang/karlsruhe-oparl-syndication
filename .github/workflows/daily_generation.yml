name: Feed Generation

# The whole pipeline in one job: fetch → enrich → LLM (time-budgeted) → render →
# commit. There is no separate backfill: capacity a run has left over after the
# recent papers summarizes the archive, newest first.
on:
  schedule:
    # Every 4 h at an odd minute: GitHub delays crons on the full hour by hours
    # (the former 02:00 run started between 07:51 and 09:32).
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Maximum paper summaries this run (cost cap)'
        required: true
        default: '100'
      llm_budget_minutes:
        description: 'Minutes this run may spend on LLM work (time cap)'
        required: true
        default: '45'

# This is the only workflow that writes to main. Runs queue instead of overlapping;
# queued, not cancelled, so no run is lost.
concurrency:
  group: feed-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Backstop only: the LLM budget is what keeps a run short. Stays below GitHub's
    # 6 h ceiling so a hung run fails visibly instead of being killed silently.
    timeout-minutes: 330
    permissions:
      contents: write  # This gives the job permission to push changes

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch all history for .GitInfo and .Lastmod

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci

    - name: Validate project
      run: npm run typecheck && npm run lint && npm test && npm run build && npm run smoke

    # The output is kept so the last step can detect an LLM outage. Summaries are
    # fail-open, so an expired key otherwise leaves every run green while no summary
    # is written: that happened from 2026-10-22 until it was noticed on 2026-10-24.
    - name: Run generate script
      run: |
        set -o pipefail
        npm run generate 2>&1 | tee "$RUNNER_TEMP/generate.log"
      env:
        SUMMARY_MAX_ITEMS_PER_RUN: ${{ inputs.max_items || '100' }}
        LLM_BUDGET_MINUTES: ${{ inputs.llm_budget_minutes || '45' }}
        GENERATE_LLM_SUMMARIES: 'true'
        LLM_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

    # Rejects a malformed, empty or unexpectedly shrunken feed before it can be
    # committed. Runs in-repo (npm run validate:feed) so the same check is
    # reproducible locally and does not depend on the runner image's tooling.
    - name: Validate generated feeds
      run: npm run validate:feed

    - name: Commit and push if changes
      id: commit
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        dateFormatted=$(date -u +"%Y-%m-%d %H:%M:%S")
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-generate feed - $dateFormatted"
          # Only this workflow writes to main, but a human push may have landed.
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Runs after the commit, so the feed is still published; it only turns the run
    # red (and triggers GitHub's failure notification) when every LLM request of a
    # step failed, which means the provider or key is broken, not a single paper.
    - name: Fail on LLM outage
      run: |
        if grep -E "attempt\(s\) failed this run" "$RUNNER_TEMP/generate.log"; then
          echo "::error::Every LLM request of a step failed; check the OPENCODE_API_KEY secret and the provider."
          exit 1
        fi

    # Tells karlsruhe-oparl-viewer to rebuild instead of it guessing when this run
    # has finished. GITHUB_TOKEN cannot trigger workflows in another repository, so
    # this uses a fine-grained PAT scoped to the viewer repo with "Contents: read
    # and write". `!cancelled()` sends it even when the LLM-outage check failed,
    # because the feed was still pushed. The viewer keeps a daily cron as a safety
    # net, so a failed dispatch (e.g. an expired token) turns this run red but
    # delays the site by at most a day.
    - name: Notify viewer
      if: ${{ !cancelled() && steps.commit.outputs.pushed == 'true' }}
      run: |
        gh api repos/maxliesegang/karlsruhe-oparl-viewer/dispatches \
          -f event_type=syndication-updated \
          -f "client_payload[sha]=$(git rev-parse HEAD)"
      env:
        GH_TOKEN: ${{ secrets.VIEWER_DISPATCH_TOKEN }}
